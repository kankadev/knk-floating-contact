name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          coverage: none
      - name: PHP syntax
        run: find . -name '*.php' -not -path './.test-wordpress/*' -print0 | xargs -0 -n1 php -l
      - name: Test against WordPress
        run: |
          curl --fail --silent --show-error --location https://wordpress.org/latest.tar.gz -o /tmp/wordpress.tar.gz
          mkdir .test-wordpress
          tar -xzf /tmp/wordpress.tar.gz -C .test-wordpress --strip-components=1
          php tests/run.php .test-wordpress
          php tests/uninstall-multisite.php
      - name: Build installable package
        run: python3 scripts/build-release.py
